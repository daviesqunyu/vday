<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Responses - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9ec4 0%, #ffc0cb 50%, #ffb6c1 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
        }

        h1 {
            color: #ff1493;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #ff69b4;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }

        .stat-card h2 {
            font-size: 3rem;
            color: #ff1493;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #ff1493;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .highlight-card {
            background: linear-gradient(135deg, #ff1493, #ff69b4) !important;
            color: white !important;
            animation: pulse 2s infinite;
        }

        .highlight-card h2,
        .highlight-card p {
            color: white !important;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .monitoring-status {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 20px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(46, 125, 50, 0.2);
        }

        .monitoring-status i {
            color: #4caf50;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .new-response-alert {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            animation: slideDown 0.5s ease;
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.4);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .refresh-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
        }

        .responses-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .responses-table th {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            padding: 15px;
            text-align: left;
            border-radius: 10px 10px 0 0;
        }

        .responses-table td {
            padding: 15px;
            border-bottom: 1px solid #ffb6c1;
        }

        .responses-table tr:hover {
            background: #fff0f5;
        }

        .yes-badge {
            background: #ff1493;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff69b4;
            font-size: 1.2rem;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #ff69b4;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .responses-table {
                font-size: 0.9rem;
            }

            .responses-table th,
            .responses-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-heart"></i> Valentine Responses</h1>
        <p class="subtitle">See who said yes! 💕</p>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <h2 id="totalResponses">0</h2>
                <p>Total Responses</p>
            </div>
            <div class="stat-card highlight-card">
                <h2 id="yesResponses">0</h2>
                <p>Yes Answers 💕</p>
            </div>
            <div class="stat-card">
                <h2 id="lastResponseTime">--</h2>
                <p>Last Response</p>
            </div>
        </div>
        
        <div class="monitoring-status" id="monitoringStatus">
            <i class="fas fa-circle"></i> 
            <span>Monitoring Active - Auto-refresh every 5 seconds</span>
        </div>

        <button class="refresh-btn" onclick="loadResponses()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>

        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading responses...
        </div>

        <div id="responsesContainer"></div>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function loadResponses() {
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const responsesContainer = document.getElementById('responsesContainer');
            
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            responsesContainer.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/api/responses`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load responses');
                }

                const responses = data.responses || [];
                
                // Update stats
                document.getElementById('totalResponses').textContent = responses.length;
                const yesCount = responses.filter(r => r.answer === 'yes').length;
                document.getElementById('yesResponses').textContent = yesCount;

                // Display responses
                if (responses.length === 0) {
                    responsesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-heart-broken"></i>
                            <h2>No responses yet</h2>
                            <p>Waiting for someone to say yes... 💕</p>
                        </div>
                    `;
                } else {
                    let tableHTML = `
                        <table class="responses-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Answer</th>
                                    <th>Date & Time</th>
                                    <th>Device</th>
                                    <th>Browser</th>
                                    <th>IP Address</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    responses.forEach((resp, index) => {
                        const date = new Date(resp.timestamp || resp.created_at);
                        const formattedDate = date.toLocaleString();
                        const isNew = index === 0; // Highlight newest response
                        tableHTML += `
                            <tr ${isNew ? 'style="background: #fff0f5; font-weight: bold;"' : ''}>
                                <td>#${resp.id}</td>
                                <td><span class="yes-badge">${resp.answer.toUpperCase()}</span></td>
                                <td>${formattedDate}</td>
                                <td>${resp.device_type || 'Unknown'}</td>
                                <td>${resp.browser_info || 'Unknown'}</td>
                                <td>${resp.ip_address || 'Unknown'}</td>
                            </tr>
                        `;
                    });

                    tableHTML += `
                            </tbody>
                        </table>
                    `;

                    responsesContainer.innerHTML = tableHTML;
                }

            } catch (error) {
                console.error('Error loading responses:', error);
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        let lastResponseId = 0;
        let notificationSound = null;

        // Create notification sound
        function createNotificationSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Check for browser notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Show browser notification
        function showNotification(message) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('💕 New Response!', {
                    body: message,
                    icon: 'https://cdn-icons-png.flaticon.com/512/833/833472.png',
                    badge: 'https://cdn-icons-png.flaticon.com/512/833/833472.png'
                });
            }
        }

        // Load responses on page load
        loadResponses();

        // Enhanced auto-refresh with new response detection
        async function checkForNewResponses() {
            try {
                const response = await fetch(`${API_URL}/api/latest-response`);
                const data = await response.json();
                
                if (data.response && data.response.id !== lastResponseId) {
                    if (lastResponseId > 0) {
                        // New response detected!
                        createNotificationSound();
                        showNotification(`Someone said ${data.response.answer.toUpperCase()}! 🎉`);
                        
                        // Show alert banner
                        const alertDiv = document.createElement('div');
                        alertDiv.className = 'new-response-alert';
                        alertDiv.innerHTML = `
                            <h3>🎉 NEW RESPONSE RECEIVED! 🎉</h3>
                            <p>Answer: <strong>${data.response.answer.toUpperCase()}</strong></p>
                            <p>Time: ${new Date(data.response.timestamp || data.response.created_at).toLocaleString()}</p>
                        `;
                        const container = document.querySelector('.container');
                        const stats = document.getElementById('stats');
                        container.insertBefore(alertDiv, stats);
                        
                        // Remove alert after 5 seconds
                        setTimeout(() => {
                            alertDiv.remove();
                        }, 5000);
                    }
                    lastResponseId = data.response.id;
                    loadResponses(); // Reload all responses
                }
            } catch (error) {
                console.error('Error checking for new responses:', error);
            }
        }

        // Auto-refresh every 5 seconds (faster monitoring)
        setInterval(checkForNewResponses, 5000);
        
        // Also update stats every 5 seconds
        setInterval(async () => {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const data = await response.json();
                document.getElementById('totalResponses').textContent = data.total || 0;
                document.getElementById('yesResponses').textContent = data.yesCount || 0;
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }, 5000);

        // Update last response time
        function updateLastResponseTime() {
            fetch(`${API_URL}/api/latest-response`)
                .then(res => res.json())
                .then(data => {
                    if (data.response) {
                        const date = new Date(data.response.timestamp || data.response.created_at);
                        const timeAgo = getTimeAgo(date);
                        document.getElementById('lastResponseTime').textContent = timeAgo;
                    } else {
                        document.getElementById('lastResponseTime').textContent = 'Never';
                    }
                })
                .catch(err => console.error('Error:', err));
        }

        function getTimeAgo(date) {
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            
            if (seconds < 60) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            return date.toLocaleDateString();
        }

        // Update last response time every 10 seconds
        setInterval(updateLastResponseTime, 10000);
        updateLastResponseTime();
    </script>
</body>
</html>
