<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Responses - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9ec4 0%, #ffc0cb 50%, #ffb6c1 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
        }

        h1 {
            color: #ff1493;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #ff69b4;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }

        .stat-card h2 {
            font-size: 3rem;
            color: #ff1493;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #ff1493;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
        }

        .responses-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .responses-table th {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            padding: 15px;
            text-align: left;
            border-radius: 10px 10px 0 0;
        }

        .responses-table td {
            padding: 15px;
            border-bottom: 1px solid #ffb6c1;
        }

        .responses-table tr:hover {
            background: #fff0f5;
        }

        .yes-badge {
            background: #ff1493;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff69b4;
            font-size: 1.2rem;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #ff69b4;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .responses-table {
                font-size: 0.9rem;
            }

            .responses-table th,
            .responses-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-heart"></i> Valentine Responses</h1>
        <p class="subtitle">See who said yes! 💕</p>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <h2 id="totalResponses">0</h2>
                <p>Total Responses</p>
            </div>
            <div class="stat-card">
                <h2 id="yesResponses">0</h2>
                <p>Yes Answers</p>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadResponses()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>

        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading responses...
        </div>

        <div id="responsesContainer"></div>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function loadResponses() {
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const responsesContainer = document.getElementById('responsesContainer');
            
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            responsesContainer.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/api/responses`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load responses');
                }

                const responses = data.responses || [];
                
                // Update stats
                document.getElementById('totalResponses').textContent = responses.length;
                const yesCount = responses.filter(r => r.answer === 'yes').length;
                document.getElementById('yesResponses').textContent = yesCount;

                // Display responses
                if (responses.length === 0) {
                    responsesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-heart-broken"></i>
                            <h2>No responses yet</h2>
                            <p>Waiting for someone to say yes... 💕</p>
                        </div>
                    `;
                } else {
                    let tableHTML = `
                        <table class="responses-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Answer</th>
                                    <th>Date & Time</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    responses.forEach(resp => {
                        const date = new Date(resp.timestamp || resp.created_at);
                        const formattedDate = date.toLocaleString();
                        tableHTML += `
                            <tr>
                                <td>#${resp.id}</td>
                                <td><span class="yes-badge">${resp.answer.toUpperCase()}</span></td>
                                <td>${formattedDate}</td>
                            </tr>
                        `;
                    });

                    tableHTML += `
                            </tbody>
                        </table>
                    `;

                    responsesContainer.innerHTML = tableHTML;
                }

            } catch (error) {
                console.error('Error loading responses:', error);
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        // Load responses on page load
        loadResponses();

        // Auto-refresh every 30 seconds
        setInterval(loadResponses, 30000);
    </script>
</body>
</html>
